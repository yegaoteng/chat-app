name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      GRADLE_HOME: /opt/gradle/gradle-8.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept SDK licenses
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          printf '%s' '24333f8a63b6825ea9c5514f83c2829b004d1fee' > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          printf '%s' '84831b9409646a918e30573bab4c9c91346d8abd' > "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license"
          echo "licenses ok"

      - name: Install SDK components
        run: |
          SM=$(ls "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager: $SM"
          if [ -n "$SM" ]; then
            yes 2>/dev/null | "$SM" --sdk_root="$ANDROID_SDK_ROOT" --install "platform-tools" "platforms;android-33" "build-tools;33.0.2" || echo "sdkmanager install skipped"
          fi
          echo "--- platforms ---"
          ls "$ANDROID_SDK_ROOT/platforms" 2>/dev/null || echo none
          echo "--- build-tools ---"
          ls "$ANDROID_SDK_ROOT/build-tools" 2>/dev/null || echo none

      - name: Install Gradle 8.2
        run: |
          sudo mkdir -p /opt/gradle
          cd /opt/gradle
          curl -sSL -o g.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          ls -lh g.zip
          sudo unzip -q -o g.zip
          rm -f g.zip
          ls /opt/gradle
          "$GRADLE_HOME/bin/gradle" --version | head -5

      - name: Prepare project layout
        run: |
          if [ -f AndroidManifest.xml ] && [ -d src ]; then
            echo "module root detected, wrapping"
            mkdir -p /tmp/wrap/app
            for x in * .[!.]*; do
              if [ "$x" = ".github" ]; then continue; fi
              if [ -e "$x" ]; then mv "$x" /tmp/wrap/app/ 2>/dev/null; fi
            done
            mv /tmp/wrap/app . 2>/dev/null || true
          fi
          ls -la
          echo "--- app ---"
          ls -la app 2>/dev/null | head -20

      - name: Write settings.gradle
        run: |
          cat > settings.gradle <<'EOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven { url 'https://maven.pkg.jetbrains.space/kotlin/p/kotlin/bootstrap' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/google' }
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven { url 'https://maven.pkg.jetbrains.space/kotlin/p/kotlin/bootstrap' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/google' }
    }
}
rootProject.name = 'chat'
include ':app'
EOF
          cat settings.gradle

      - name: Write root build.gradle
        run: |
          cat > build.gradle <<'EOF'
buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        // Kotlin 预发布版（如 1.8.20-RC2）只在 JetBrains 自己的仓库里
        maven { url 'https://maven.pkg.jetbrains.space/kotlin/p/kotlin/bootstrap' }
        // 兜底镜像
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/google' }
    }
    dependencies { classpath 'com.android.tools.build:gradle:8.1.4' }
    // AGP 8.1.4 会要 kotlin-stdlib-jdk8:1.8.20-RC2，公开仓库没有，统一换成正式版
    configurations.classpath {
        resolutionStrategy {
            eachDependency { d ->
                if (d.requested.group == 'org.jetbrains.kotlin'
                        && d.requested.name.startsWith('kotlin-stdlib')) {
                    d.useVersion '1.8.22'
                }
            }
        }
    }
}
EOF
          cat build.gradle

      - name: Write gradle.properties
        run: |
          printf '%s\n' "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" "org.gradle.daemon=false" "org.gradle.parallel=false" "android.useAndroidX=false" > gradle.properties
          cat gradle.properties

      - name: Show versions
        run: |
          echo "gradle: $("$GRADLE_HOME/bin/gradle" --version | grep Gradle)"
          echo "sdk platforms:"; ls "$ANDROID_SDK_ROOT/platforms" 2>/dev/null || echo none
          echo "sdk build-tools:"; ls "$ANDROID_SDK_ROOT/build-tools" 2>/dev/null || echo none
          echo "--- app/build.gradle ---"
          cat app/build.gradle 2>/dev/null || echo "app/build.gradle 缺失"

      - name: Verify signing keystore
        run: |
          # 上传前先确认 keystore 是完整二进制，不是空文件/文本
          if [ -f app/keystore.jks ]; then
            echo "keystore 大小: $(stat -c%s app/keystore.jks) 字节"
            echo "文件类型: $(file -b app/keystore.jks 2>/dev/null || echo '未知')"
            od -An -tx1 -N4 app/keystore.jks
          else
            echo "app/keystore.jks 不存在"
          fi

      - name: Prepare signing keystore
        env:
          KS_B64:   ${{ secrets.SIGN_KEYSTORE_BASE64 }}
          KS_PWD:   ${{ secrets.SIGN_STORE_PASSWORD }}
          KA_PWD:   ${{ secrets.SIGN_KEY_PASSWORD }}
          KA_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
        run: |
          # 方式 B：Secrets 里存了 base64 keystore（推荐，仓库里不留密钥文件）
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > /tmp/signing.jks
            echo "SIGN_KEYSTORE=/tmp/signing.jks" >> "$GITHUB_ENV"
            echo "SIGN_STORE_PASSWORD=$KS_PWD"     >> "$GITHUB_ENV"
            echo "SIGN_KEY_PASSWORD=$KA_PWD"       >> "$GITHUB_ENV"
            if [ -n "$KA_ALIAS" ]; then
              echo "SIGN_KEY_ALIAS=$KA_ALIAS" >> "$GITHUB_ENV"
            fi
            echo "签名：使用 GitHub Secrets 中的 keystore"
          elif [ -f app/keystore.jks ]; then
            # 方式 A：仓库里带了 keystore.jks（密码可用 app/signing.properties 覆盖）
            echo "签名：使用仓库内 app/keystore.jks"
            if [ -f app/signing.properties ]; then
              echo "签名参数：使用 app/signing.properties"
            fi
          else
            # 不允许降级：仓库里没有 keystore 就让构建失败，避免产出装不上的包
            echo "::error::未找到 app/keystore.jks，且未配置 SIGN_KEYSTORE_BASE64"
            echo "请上传 app/keystore.jks（二进制文件上传），或在 Secrets 里配置 SIGN_KEYSTORE_BASE64"
            exit 1
          fi

      - name: Check repo connectivity
        run: |
          # 先看看仓库通不通，方便区分「网络问题」和「代码问题」
          for u in \
            https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/8.1.4/gradle-8.1.4.pom \
            https://repo1.maven.org/maven2/commons-io/commons-io/2.4/commons-io-2.4.pom \
            https://plugins.gradle.org/m2/ ; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 20 "$u" || echo ERR)
            echo "$code  $u"
          done

      - name: Build Debug APK
        run: |
          # 仓库偶发抽风会导致依赖下载 404，这里自动重试 3 次
          for i in 1 2 3; do
            echo "===== 第 $i 次尝试 ====="
            if [ "$i" = "1" ]; then
              "$GRADLE_HOME/bin/gradle" :app:assembleDebug --stacktrace --no-daemon && exit 0
            else
              "$GRADLE_HOME/bin/gradle" :app:assembleDebug --stacktrace --no-daemon \
                --refresh-dependencies && exit 0
            fi
            echo "第 $i 次失败，20 秒后重试"
            sleep 20
          done
          echo "::error::三次尝试都失败。若为依赖下载失败，多为仓库网络波动，稍后在 Actions 里点 Re-run 重试即可。"
          exit 1

      - name: Show APK signature
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -1)
          echo "apk: $APK"
          if [ -n "$APK" ]; then
            # 打印签名指纹，方便确认每次构建是否一致
            KS=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | head -1)
            if [ -n "$KS" ]; then
              "$KS" verify --print-certs "$APK" 2>/dev/null | grep -E "DN:|SHA-1|SHA-256" || echo "(apksigner 无输出)"
            else
              echo "(未找到 apksigner)"
            fi
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chat-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
